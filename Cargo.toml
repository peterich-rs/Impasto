[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/uicore",
    "crates/engine",
    "crates/impeller-sys",
    "crates/js",
    "crates/js-headless",
    "crates/js-host",
    "crates/session",
    "crates/shell",
    "crates/macos",
    "crates/android",
    "crates/quickjs",
    "crates/cli",
    "crates/reactive",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2"
protocol = { path = "crates/protocol" }
uicore = { path = "crates/uicore" }
engine = { path = "crates/engine" }
impeller = { package = "impeller-sys", path = "crates/impeller-sys" }
js = { path = "crates/js" }
js-host = { path = "crates/js-host" }
session = { path = "crates/session" }
shell = { path = "crates/shell" }
quickjs = { path = "crates/quickjs" }
rquickjs = { package = "quickjs-jit", version = "=0.14.2", default-features = false, features = ["std", "loader", "macro", "bindgen"] }

[profile.dev.package.quickjs-jit-sys]
opt-level = 3

# Keep Android debug builds debuggable without running the per-frame graph and
# scene bridge unoptimized against the same wall-clock budget as release.
[profile.dev.package.reactive]
opt-level = 2

[profile.dev.package.quickjs]
opt-level = 2

[profile.dev.package.uicore]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
cast_possible_truncation = "warn"
