[workspace]
resolver = "3"
members = [
    "protocol",
    "uicore",
    "engine",
    "session",
    "hosts/hostshell",
    "hosts/macos",
    "hosts/android",
    "runtimes/quickjs",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2"
protocol = { path = "protocol" }
uicore = { path = "uicore" }
engine = { path = "engine" }
session = { path = "session" }
hostshell = { path = "hosts/hostshell" }
quickjs = { path = "runtimes/quickjs" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
