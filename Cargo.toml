[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/uicore",
    "crates/engine",
    "crates/session",
    "crates/hostshell",
    "crates/macos",
    "crates/android",
    "crates/quickjs",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2"
protocol = { path = "crates/protocol" }
uicore = { path = "crates/uicore" }
engine = { path = "crates/engine" }
session = { path = "crates/session" }
hostshell = { path = "crates/hostshell" }
quickjs = { path = "crates/quickjs" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
cast_possible_truncation = "warn"
