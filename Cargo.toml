[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/raster",
    "crates/shader",
    "crates/javascript",
    "crates/embedder/common",
    "crates/embedder/android",
    "crates/embedder/macos",
    "crates/embedder/ios",
    "crates/cli",
    "crates/bundler",
    "crates/testing",
    "crates/impasto",
    "crates/impasto-macros",
    "crates/embedder/bundled",
    "packages/app-state/rust",
    "packages/async-storage/rust",
    "packages/clipboard/rust",
    "packages/camera/rust",
    "packages/devtools/rust",
    "packages/file-system/rust",
    "packages/http/rust",
    "packages/linking/rust",
    "packages/permissions/rust",
    "packages/websocket/rust",
]
exclude = ["examples/native-order/rust"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
oxc = { version = "=0.153.0", features = ["ast_visit", "codegen", "semantic", "transformer"] }
rolldown = "=1.2.13"
rolldown_common = "=1.2.13"
thiserror = "2"
impasto = { path = "crates/impasto" }
engine = { path = "crates/engine" }
raster = { path = "crates/raster" }
javascript = { path = "crates/javascript", default-features = false }
embedder = { path = "crates/embedder/common" }
rquickjs = { package = "quickjs-jit", version = "=0.14.2", default-features = false, features = ["std", "loader", "macro", "bindgen"] }

[profile.dev.package.quickjs-jit-sys]
opt-level = 3

# Keep Android debug builds debuggable without running the per-frame graph and
# scene bridge unoptimized against the same wall-clock budget as release.
[profile.dev.package.javascript]
opt-level = 2

[profile.dev.package.engine]
opt-level = 2

[profile.dev.package.raster]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.kurbo]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
cast_possible_truncation = "warn"
