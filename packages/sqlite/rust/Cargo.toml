[package]
name = "impasto-sqlite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
impasto.workspace = true
impasto-file-system = { version = "0.1.0", registry = "impasto" }
impasto-crypto = { version = "0.1.0", registry = "impasto" }

hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions", "vtab", "array", "limits", "hooks"] }
zeroize = "1"
tokio = { version = "1", features = ["rt"] }

[features]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
tempfile = "3"


[lints]
workspace = true
