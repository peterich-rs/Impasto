[package]
name = "impasto-file-system"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
impasto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(any(target_vendor = "apple", target_os = "android", target_os = "linux"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[lints]
workspace = true
