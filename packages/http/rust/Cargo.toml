[package]
name = "impasto-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
impasto.workspace = true
impasto-file-system = { version = "0.1.0", registry = "impasto" }
base64 = "0.22"
cookie = "0.18.2"
cookie_store = "0.21.1"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
x509-parser = "0.18"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }

futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
pollster = "0.4"

[target.'cfg(not(target_os = "ios"))'.dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
openwire = "0.1.2"
http-body = "1"
ipnet = "2"
openwire-rustls = "0.1.2"
rustls = { version = "0.23", features = ["aws_lc_rs"], default-features = false }
rustls-platform-verifier = "0.7"
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
security-framework = { version = "3", features = ["macos-12"] }
core-foundation = "0.10"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSOperation", "NSString",
    "NSURL", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSURLError",
    "NSURLAuthenticationChallenge", "NSURLCredential", "NSURLProtectionSpace", "NSValue", "NSEnumerator", "NSObject",
] }

[lints]
workspace = true
