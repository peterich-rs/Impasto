[package]
name = "impasto-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
impasto.workspace = true

futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
pollster = "0.4"

[target.'cfg(not(target_os = "ios"))'.dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
openwire = "0.1.2"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSArray", "NSData", "NSDictionary", "NSError", "NSOperation", "NSString",
    "NSURL", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSURLError",
] }

[lints]
workspace = true
