[package]
name = "impasto-websocket"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
impasto.workspace = true

bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSArray", "NSData", "NSError", "NSString", "NSURL", "NSURLSession",
] }

[target.'cfg(target_os = "ios")'.dev-dependencies]
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[lints]
workspace = true
