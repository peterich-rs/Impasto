[package]
name = "impasto-intl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
embedded-data = ["dep:miniz_oxide", "icu_provider_blob/alloc"]
datagen = [
    "dep:miniz_oxide", "icu/datagen", "icu/unstable", "icu_experimental/datagen", "dep:icu_locale_core", "icu_provider_blob/export", "icu_provider/baked",
    "dep:icu_calendar_data", "dep:icu_collator_data", "dep:icu_datetime_data", "dep:icu_decimal_data",
    "dep:icu_experimental_data", "dep:icu_locale_fallback_data", "dep:icu_normalizer_data",
    "dep:icu_plurals_data", "dep:zerovec", "dep:icu_pattern", "dep:zerotrie",
]

[dependencies]
impasto.workspace = true

icu = { version = "~2.3.0", features = ["serde", "sync"] }
icu_experimental = { version = "0.6", features = ["serde"] }
icu_provider_blob = "~2.3.0"
icu_provider = { version = "~2.3.0", features = ["sync"] }
icu_locale_fallback = "~2.3.0"
icu_locale_core = { version = "~2.3.0", optional = true }
icu_calendar_data = { version = "~2.3.0", optional = true }
icu_collator_data = { version = "~2.3.0", optional = true }
icu_datetime_data = { version = "~2.3.0", optional = true }
icu_decimal_data = { version = "~2.3.0", optional = true }
icu_experimental_data = { version = "0.6", optional = true }
icu_locale_fallback_data = { version = "~2.3.0", optional = true }
icu_normalizer_data = { version = "~2.3.0", optional = true }
icu_plurals_data = { version = "~2.3.0", optional = true }
icu_pattern = { version = "0.5", optional = true }
zerovec = { version = "0.11", optional = true }
zerotrie = { version = "0.2", optional = true }
fixed_decimal = { version = "0.7", features = ["ryu"] }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
writeable = "0.6"
lru = "0.18"
miniz_oxide = { version = "0.9", optional = true }

[lints]
workspace = true
