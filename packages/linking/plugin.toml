[plugin]
platforms = ["macos", "ios", "android"]
min_impasto_version = "0.1.0"

[rust]
path = "rust"

[ios]
path = "apple/ios"
package = "ImpastoLinking"
plugin_class = "ImpastoLinkingPlugin"

[macos]
path = "apple/macos"
package = "ImpastoLinking"
plugin_class = "ImpastoLinkingPlugin"

[android]
path = "android"
package = "dev.impasto.plugins.linking"
plugin_class = "LinkingPlugin"
