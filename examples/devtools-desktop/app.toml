name = "devtools-desktop"
version = "0.1.0"
targets = ["macos"]

[macos.window]
title = "Impasto DevTools"
width = 1400
height = 880
min_width = 960
min_height = 600
autosave_name = "impasto.devtools.main"

[dependencies]
"@impasto/solid-renderer" = "builtin"
"@impasto/solid-ui" = "builtin"
"@impasto/file-system" = "builtin"
"@impasto/clipboard" = "builtin"
