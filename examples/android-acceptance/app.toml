name = "android-acceptance"
version = "0.1.0"
targets = ["macos", "android", "ios"]

[android]
application_id = "dev.impasto.fieldnotes"
version_code = 1
permissions = ["android.permission.CAMERA"]

[[android.deep_links]]
scheme = "impasto-demo"
host = "record"

[ios]
bundle_id = "dev.impasto.fieldnotes"
url_schemes = ["impasto-demo"]
share_window_state = true

[ios.usage_descriptions]
NSCameraUsageDescription = "用于拍摄并附加本次现场检查的照片。"

NSPhotoLibraryUsageDescription = "用于选择本次现场检查的照片。"
NSLocationWhenInUseUsageDescription = "用于记录现场检查的位置。"

[macos.usage_descriptions]
NSCameraUsageDescription = "用于拍摄并附加本次现场检查的照片。"
NSPhotoLibraryUsageDescription = "用于选择本次现场检查的照片。"
NSLocationUsageDescription = "用于记录现场检查的位置。"

[macos.entitlements]
"com.apple.security.device.camera" = true
"com.apple.security.personal-information.location" = true

[plugins."@impasto/permissions"]
enabled = ["camera", "photos", "locationWhenInUse", "scheduleExactAlarm"]

[dependencies]
"@impasto/app-state" = "builtin"
"@impasto/async-storage" = "builtin"
"@impasto/clipboard" = "builtin"
"@impasto/connectivity" = "builtin"
"@impasto/file-system" = "builtin"
"@impasto/haptics" = "builtin"
"@impasto/linking" = "builtin"
"@impasto/permissions" = "builtin"
"@impasto/share" = "builtin"
"@impasto/solid-renderer" = "builtin"
"@impasto/solid-ui" = "builtin"
"@impasto/system-info" = "builtin"
