name = "native-camera"
version = "0.1.0"
targets = ["ios", "android", "macos"]

[ios]
bundle_id = "dev.impasto.native-camera"

[ios.usage_descriptions]
NSCameraUsageDescription = "Show the camera preview, scan QR codes, and take photos."

[macos.usage_descriptions]
NSCameraUsageDescription = "Check camera access for the scanner."

[macos.entitlements]
"com.apple.security.device.camera" = true

[plugins."@impasto/permissions"]
enabled = ["camera"]

[dependencies]
"@impasto/camera" = "builtin"
"@impasto/permissions" = "builtin"
"@impasto/solid-renderer" = "builtin"
"@impasto/solid-ui" = "builtin"
