name = "native-camera"
version = "0.1.0"
targets = ["ios", "android"]

[ios]
bundle_id = "dev.impasto.native-camera"

[ios.usage_descriptions]
NSCameraUsageDescription = "Show the camera preview, scan QR codes, and take photos."

[dependencies]
"@impasto/camera" = "builtin"
"@impasto/permissions" = "builtin"
"@impasto/solid-renderer" = "builtin"
"@impasto/solid-ui" = "builtin"
