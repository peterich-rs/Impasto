name: Impeller SDK

on:
  pull_request:
    paths:
      - '.github/workflows/impeller-sdk.yml'
      - 'crates/impeller-sys/**'
      - 'tools/build_impeller.py'
      - 'tools/impeller_sdk.py'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish every verified target as a versioned GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: impeller-sdk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "targets=$(python3 tools/impeller_sdk.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      SDK_TARGET: ${{ matrix.target }}
      DEPOT_TOOLS_UPDATE: '0'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          packages=(libclang-dev pkg-config libgtk-3-dev libgl-dev libegl-dev libx11-dev libxcb1-dev libwayland-dev)
          network_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          source_options=()

          download_dependencies() {
            sudo timeout --kill-after=15s 3m apt-get "${network_options[@]}" "${source_options[@]}" update --error-on=any &&
              sudo timeout --kill-after=15s 5m apt-get "${network_options[@]}" "${source_options[@]}" install --download-only -y --no-install-recommends "${packages[@]}"
          }

          if ! download_dependencies; then
            case "$(dpkg --print-architecture)" in
              amd64) archive=https://mirrors.edge.kernel.org/ubuntu/ ;;
              arm64) archive=https://ports.ubuntu.com/ubuntu-ports/ ;;
              *) exit 1 ;;
            esac
            fallback="$RUNNER_TEMP/impeller-ubuntu.sources"
            cat > "$fallback" <<EOF
          Types: deb
          URIs: $archive
          Suites: noble noble-updates noble-security noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            echo "Retrying Ubuntu dependency downloads from $archive"
            source_options=(-o "Dir::Etc::sourcelist=$fallback" -o Dir::Etc::sourceparts=-)
            download_dependencies
          fi

          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${source_options[@]}" install --no-download -y --no-install-recommends "${packages[@]}"
      - name: Xcode Metal Toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent metalToolchain
          fi
      - name: Windows toolchain setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if (-not $vs) { throw 'Visual Studio C++ tools were not found' }
          $sdkInclude = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include/10.0.22621.0/um/Windows.h'
          if (-not (Test-Path $sdkInclude)) {
            $installer = Join-Path (Split-Path $vswhere) 'setup.exe'
            $arguments = 'modify --installPath "{0}" --add Microsoft.VisualStudio.Component.Windows11SDK.22621 --quiet --norestart' -f $vs.installationPath
            $install = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($install.ExitCode -notin 0, 3010 -or -not (Test-Path $sdkInclude)) {
              throw "Windows SDK 10.0.22621.0 installation failed (exit $($install.ExitCode))"
            }
          }
          $year = @{17 = '2022'; 18 = '2026'}[([version] $vs.installationVersion).Major]
          if (-not $year) { throw "Unsupported Visual Studio version $($vs.installationVersion)" }
          "GYP_MSVS_OVERRIDE_PATH=$($vs.installationPath)" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=$year" >> $env:GITHUB_ENV
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) {
            $llvm = Join-Path $vs.installationPath 'VC/Tools/Llvm/x64/bin'
          }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      - name: Install source build tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          cargo install --locked bindgen-cli --version 0.72.1
      - name: Compile standalone Impeller and generate bindings
        run: python tools/impeller_sdk.py build "$SDK_TARGET"
      - name: Package SDK
        run: python tools/impeller_sdk.py package "$SDK_TARGET" --output build/impeller-packages
      - uses: actions/upload-artifact@v4
        with:
          name: impeller-${{ matrix.target }}
          path: build/impeller-packages/*.zip
          compression-level: 0
          if-no-files-found: error

  verify:
    needs: [build, targets]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SDK_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v5
        with:
          name: impeller-${{ matrix.target }}
          path: build/impeller-packages
      - name: Prepare only from the packaged SDK
        run: |
          index=$(python tools/impeller_sdk.py index build/impeller-packages | tr -d '\r')
          sdk=$(IMPASTO_IMPELLER_LOCK="$index" python tools/impeller_sdk.py prepare "$SDK_TARGET" | tr -d '\r')
          echo "IMPASTO_IMPELLER_SDK_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Link bindings and verify the ABI on native targets
        run: |
          rustup target add "$SDK_TARGET"
          host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          if [[ "$SDK_TARGET" == "$host" ]]; then
            cargo test --locked -p impeller-sys --features link --target "$SDK_TARGET"
          elif [[ "$SDK_TARGET" == *-linux-android ]]; then
            ndk=${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}
            test -n "$ndk"
            bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
            export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android24-clang"
            cargo test --locked -p impeller-sys --features link --target "$SDK_TARGET" --no-run
          elif [[ "$SDK_TARGET" == *-apple-ios* ]]; then
            IPHONEOS_DEPLOYMENT_TARGET=15.0 cargo test --locked -p impeller-sys --features link --target "$SDK_TARGET" --no-run
          else
            cargo test --locked -p impeller-sys --features link --target "$SDK_TARGET" --no-run
          fi
      - name: Test the macOS renderer against the packaged SDK
        if: runner.os == 'macOS' && endsWith(matrix.target, '-darwin')
        run: cargo test --locked -p raster --features impeller --target "$SDK_TARGET"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: impeller-*
          path: build/impeller-packages
          merge-multiple: true
      - name: Publish locked SDK packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock=crates/impeller-sys/sdk.lock
          version=$(sed -n 's/^version //p' "$lock")
          repository=$(sed -n 's/^repository //p' "$lock")
          test "$repository" = "$GITHUB_REPOSITORY"
          python3 tools/impeller_sdk.py index build/impeller-packages --release
          gh release create "$version" build/impeller-packages/sdk.lock build/impeller-packages/*.zip \
            --target "$GITHUB_SHA" --title "Impeller SDK $version" --notes "Standalone Impeller libraries and Rust bindings."
