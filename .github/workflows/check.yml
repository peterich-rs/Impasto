# 与 just check 对齐，并检查 rustfmt。
# 不下载 Impeller SDK，也不下载 quickjs-ng。
# macos crate 只在 macOS 上编译。

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: check (deny warnings)
        run: cargo check --workspace --exclude macos
        env:
          RUSTFLAGS: "-D warnings"
      - name: test
        run: cargo test --workspace --exclude macos

  rust-macos:
    name: cargo test (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test macos host
        run: cargo test -p macos

  kotlin:
    name: kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: jvmTest and gallery
        run: bash frameworks/kotlin-ui/gradlew -p frameworks/kotlin-ui :library:jvmTest

  solid:
    name: solid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: solid packages
        run: |
          cd frameworks/solid-renderer && pnpm install --frozen-lockfile
          node --conditions=browser --experimental-strip-types src/tree.test.ts
          node --experimental-strip-types runtime/frame.test.ts
          node --conditions=browser --experimental-strip-types runtime/slot.test.ts
          node --experimental-strip-types runtime/list-binding.test.ts
          node --experimental-strip-types runtime/motion.test.ts
          node --experimental-strip-types src/direction.test.ts
          cd ../..
          node --experimental-strip-types frameworks/net/src/index.test.ts
          node --experimental-strip-types frameworks/i18n/src/index.test.ts
          cd frameworks/solid-router && pnpm install --frozen-lockfile && node --experimental-strip-types src/path.test.ts && node --experimental-strip-types src/transition.test.ts && node --conditions=browser --experimental-strip-types --import ../register.mjs src/router.test.ts
          cd ../form && pnpm install --frozen-lockfile && node --conditions=browser --experimental-strip-types src/index.test.ts
          cd ../solid-ui && pnpm install --frozen-lockfile && for test in src/*.test.ts src/field/*.test.ts; do node --conditions=browser --experimental-strip-types --import ../register.mjs "$test"; done
