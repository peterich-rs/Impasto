# 与 just check 对齐，并检查 rustfmt。
# 不下载 Impeller SDK。
# macos crate 只在 macOS 上编译。

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: generated style contracts
        run: cargo run --locked -p uicore --bin style-types -- --check --root .
      - name: check (deny warnings)
        run: cargo check --workspace --exclude macos
        env:
          RUSTFLAGS: "-D warnings"
      - name: clippy
        run: cargo clippy --workspace --exclude macos --all-targets -- -D warnings
      - name: js-host dependency boundary
        run: python3 tools/check-js-host-boundary.py
      - name: js runtime dependency boundary
        run: python3 tools/check-js-runtime-boundary.py
      - name: generated native module declarations
        run: cargo run --locked -p shell --bin module-stubs -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: extractions/setup-just@v2
      - name: gallery bundle
        run: |
          pnpm install --frozen-lockfile
          just gallery-dist
      - name: native module types
        run: node tools/check-native-module-types.mjs
      - name: standard library contract
        run: node tools/check-standard-library.mjs
      - name: test
        run: cargo test --workspace --exclude macos

  rust-macos:
    name: cargo test (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy macos host
        run: cargo clippy -p macos --all-targets -- -D warnings
      - name: test macos host
        run: cargo test -p macos

  solid:
    name: solid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: solid packages
        run: |
          pnpm -C . install --frozen-lockfile
          pnpm -C . -r test
