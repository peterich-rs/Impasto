# 与 just check 对齐，并检查 rustfmt。
# embedder-macos crate 只在 macOS 上编译。
# 移动端任务仅构建和校验产物。运行测试使用逻辑用例与 Raster 离屏渲染。

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Fontconfig and a headless Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev mesa-vulkan-drivers
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: generated style contracts
        run: cargo run --locked -p engine --bin style-types -- --check --root .
      - name: check (deny warnings)
        run: cargo check --workspace --exclude embedder-macos
        env:
          RUSTFLAGS: "-D warnings"
      - name: clippy
        run: cargo clippy --workspace --exclude embedder-macos --all-targets -- -D warnings
      - name: Perfetto Trace Processor import
        run: |
          processor="$RUNNER_TEMP/trace_processor"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/google/perfetto/1e9c61e9844affd7dccd3d42d9ea9f3a3d10cf6d/tools/trace_processor --output "$processor"
          chmod +x "$processor"
          IMPASTO_TRACE_PROCESSOR="$processor" tools/check-trace-export.sh
      - name: JavaScript feature boundaries
        run: python3 tools/check-javascript-boundaries.py
      - name: generated native module declarations
        run: cargo run --locked -p embedder --bin module-stubs -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: extractions/setup-just@v2
      - name: gallery bundle
        run: |
          pnpm install --frozen-lockfile
          just gallery-dist
      - name: native module types
        run: node tools/check-native-module-types.mjs
      - name: standard library contract
        run: node tools/check-standard-library.mjs
      - name: Rust logic tests
        id: logic-tests
        run: cargo test --workspace --exclude embedder-macos --exclude raster
      - name: Raster headless tests (software Vulkan)
        if: ${{ !cancelled() && (steps.logic-tests.outcome == 'success' || steps.logic-tests.outcome == 'failure') }}
        env:
          IMPASTO_TEST_GPU: "1"
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if [[ ${#icds[@]} -ne 1 ]]; then
            echo "Expected one Mesa lavapipe Vulkan ICD" >&2
            exit 1
          fi
          export VK_DRIVER_FILES="${icds[0]}"
          cargo test --locked -p raster -- --test-threads=1

  rust-macos:
    name: cargo test (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy macos host
        run: cargo clippy -p embedder-macos --all-targets -- -D warnings
      - name: test macos host
        run: cargo test -p embedder-macos

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: extractions/setup-just@v2
      - run: pnpm install --frozen-lockfile
      - name: Build and package the iOS simulator app
        run: just ios-build-check

  android:
    name: Android APK build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: extractions/setup-just@v2
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Prepare Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build and lint Android APK
        run: |
          pnpm install --frozen-lockfile
          just android-build-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-results
          path: |
            crates/embedder/android/apk/app/build/outputs/apk/debug/app-debug.apk
            crates/embedder/android/apk/app/build/reports/lint-results-debug.*

  solid:
    name: solid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: solid packages
        run: |
          pnpm -C . install --frozen-lockfile
          pnpm -C . -r test
