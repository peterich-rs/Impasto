# 与 just check 对齐，并检查 rustfmt。
# Android 任务使用仓库中的 Impeller SDK 归档。
# embedder-macos crate 只在 macOS 上编译。

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: generated style contracts
        run: cargo run --locked -p uicore --bin style-types -- --check --root .
      - name: check (deny warnings)
        run: cargo check --workspace --exclude embedder-macos
        env:
          RUSTFLAGS: "-D warnings"
      - name: clippy
        run: cargo clippy --workspace --exclude embedder-macos --all-targets -- -D warnings
      - name: JavaScript feature boundaries
        run: python3 tools/check-javascript-boundaries.py
      - name: generated native module declarations
        run: cargo run --locked -p embedder --bin module-stubs -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: extractions/setup-just@v2
      - name: gallery bundle
        run: |
          pnpm install --frozen-lockfile
          just gallery-dist
      - name: native module types
        run: node tools/check-native-module-types.mjs
      - name: standard library contract
        run: node tools/check-standard-library.mjs
      - name: test
        run: cargo test --workspace --exclude embedder-macos

  rust-macos:
    name: cargo test (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy macos host
        run: cargo clippy -p embedder-macos --all-targets -- -D warnings
      - name: test macos host
        run: cargo test -p embedder-macos

  android:
    name: Android APK and device tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: extractions/setup-just@v2
      - name: Prepare Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build and lint Android APK
        run: |
          pnpm install --frozen-lockfile
          just android-build-check
      - name: Enable hardware virtualization for the emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: just android-device-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-results
          path: |
            crates/embedder/android/apk/app/build/outputs/apk/debug/app-debug.apk
            crates/embedder/android/apk/app/build/reports/lint-results-debug.*
            crates/embedder/android/apk/app/build/outputs/androidTest-results/connected/
            crates/embedder/android/apk/app/build/reports/androidTests/connected/

  solid:
    name: solid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: solid packages
        run: |
          pnpm -C . install --frozen-lockfile
          pnpm -C . -r test
