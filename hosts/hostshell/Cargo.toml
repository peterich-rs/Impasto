[package]
name = "hostshell"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine = { workspace = true }
protocol = { workspace = true }
session = { workspace = true }
thiserror = { workspace = true }
# The workspace crate is named `core`. Linking it under that name shadows
# the standard library, and `thiserror` expands to `::core::fmt`.
ui_core = { package = "core", path = "../../core" }
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "1"

[lints]
workspace = true
