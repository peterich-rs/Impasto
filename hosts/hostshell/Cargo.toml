[package]
name = "hostshell"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine = { workspace = true }
protocol = { workspace = true }
session = { workspace = true }
thiserror = { workspace = true }
# The workspace crate is named `core`. Linking it under that name shadows
# the standard library, and `thiserror` expands to `::core::fmt`.
ui_core = { package = "core", path = "../../core" }
bytes = "1"
http = "1"
http-body-util = "0.1"
openwire = "0.1.2"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[lints]
workspace = true
