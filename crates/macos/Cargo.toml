[package]
name = "macos"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
uicore = { workspace = true }
engine = { workspace = true }
quickjs = { workspace = true }
session = { workspace = true }
hostshell = { workspace = true }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSApplication",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTextInputClient",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "CFCGTypes",
    "CFData",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGImage",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSGeometry",
    "NSDictionary",
    "NSLocale",
    "NSNotification",
    "NSDistributedNotificationCenter",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGImageDestination",
    "CGImageSource",
    "objc2-core-graphics",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLTexture",
    "MTLTypes",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVDisplayLink",
    "CVHostTime",
    "CVReturn",
] }
protocol = { workspace = true }

[lints]
workspace = true
