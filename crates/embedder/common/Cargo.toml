[package]
name = "embedder"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
devtools-server = []

[dependencies]
impasto.workspace = true
raster = { workspace = true }
thiserror = { workspace = true }
engine = { workspace = true }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
openwire = "0.1.2"
pollster = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
base64 = "0.22"
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "=0.6.0"

[target.'cfg(not(target_os = "ios"))'.dependencies]
mars-xlog = { git = "https://github.com/peterich-rs/xlog-rs", rev = "cdedbdf40868f3e1673755ec045dbf373f028fc2" }

[build-dependencies]
cc = "1"

[dev-dependencies]
javascript = { path = "../../javascript", features = ["runtime"] }

[lints]
workspace = true
