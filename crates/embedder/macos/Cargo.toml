[package]
name = "embedder-macos"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "macos"
path = "src/main.rs"

[features]
default = ["bundled-plugins"]
bundled-plugins = ["dep:impasto-bundled-plugins"]

[dependencies]
impasto-bundled-plugins = { path = "../bundled", optional = true }
anyhow = "1"
engine = { workspace = true, features = ["js"] }
raster = { workspace = true }
embedder = { workspace = true }
impasto = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSApplication",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTextInputClient",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "CFCGTypes",
    "CFData",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGImage",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSFileManager",
    "NSPathUtilities",
    "NSDate",
    "NSGeometry",
    "NSDictionary",
    "NSLocale",
    "NSNotification",
    "NSRunLoop",
    "NSDistributedNotificationCenter",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGImageDestination",
    "CGImageProperties",
    "CGImageSource",
    "objc2-core-graphics",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLTexture",
    "MTLTypes",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CADisplayLink",
    "CAFrameRateRange",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVDisplayLink",
    "CVHostTime",
    "CVReturn",
] }

[lints]
workspace = true
