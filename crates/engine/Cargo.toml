[package]
name = "engine"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[[bin]]
name = "style-types"
path = "src/bin/style-types.rs"

[features]
default = []
js = ["dep:rquickjs", "javascript/runtime", "tracing/attributes", "style-binary"]
style-binary = ["dep:base64", "dep:postcard", "dep:serde"]

[dependencies]
javascript = { workspace = true }
rquickjs = { workspace = true, optional = true }
bitflags = "2"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size", "parse"] }
lru = { version = "0.18.5", default-features = false }
thiserror = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
unicode-segmentation = "1"
kurbo = { version = "=0.13.1", default-features = false, features = ["std"] }
csscolorparser = { version = "=0.9.0", default-features = false, features = ["std", "named-colors"] }
base64 = { version = "0.22", optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[dev-dependencies]
bundler = { path = "../bundler" }

[lints]
workspace = true
