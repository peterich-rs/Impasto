[package]
name = "javascript"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:libc", "dep:rquickjs", "dep:url"]
session = ["dep:ndk-sys", "dep:protocol", "dep:uicore"]
ui = ["runtime", "session", "dep:reactive", "dep:thiserror", "dep:tracing"]

[dependencies]
libc = { version = "0.2", optional = true }
rquickjs = { workspace = true, optional = true }
url = { version = "=2.5.8", optional = true }
protocol = { workspace = true, optional = true }
uicore = { workspace = true, optional = true }
reactive = { path = "../reactive", optional = true }
thiserror = { workspace = true, optional = true }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "=0.6.0", optional = true }

[[bin]]
name = "js-headless"
path = "src/bin/js-headless.rs"
required-features = ["runtime"]

[[example]]
name = "standard-contract"
required-features = ["runtime"]

[lints]
workspace = true
