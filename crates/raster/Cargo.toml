[package]
name = "raster"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine = { workspace = true }
shader = { path = "../shader" }
thiserror = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "wgsl"] }
parley = { version = "=0.13.0", default-features = false, features = ["std", "system", "complex-scripts"] }
fontique = "=0.13.0"
swash = { version = "=0.2.10", default-features = false, features = ["std", "scale", "render"] }
lyon_tessellation = "1"
lyon_path = "1"
lyon_geom = "1"
etagere = "0.2"
fdsm = "0.8"
image = { version = "0.25", default-features = false }
slotmap = "1"
rayon = "1.12"
half = { version = "2", default-features = false }
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
raw-window-handle = "0.6"

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["metal"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "android")'.dependencies]
ash = { version = "0.38", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["dx12", "vulkan"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMetalLayer", "objc2-metal"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLTexture",
    "MTLResource",
    "MTLDevice",
    "MTLCommandBuffer",
    "MTLTypes",
] }

[build-dependencies]
naga = { version = "=30.0.2", features = ["wgsl-in"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
