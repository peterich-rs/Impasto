[package]
name = "cli"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "impasto"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
embedder = { workspace = true }
engine = { workspace = true, features = ["js"] }

[lints]
workspace = true
