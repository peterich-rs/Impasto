[package]
name = "cli"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "impasto"
path = "src/main.rs"

[features]
headless-gpu = ["testing/headless-gpu"]

[dependencies]
impasto.workspace = true
quote = "1"
syn = { version = "2", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
toml_edit = "0.25"
url = "2"
clap = { version = "4", features = ["derive"] }
engine = { workspace = true, features = ["js"] }
javascript = { workspace = true, features = ["runtime"] }
bundler = { path = "../bundler" }
testing = { path = "../testing" }
impasto-bundled-plugins = { path = "../embedder/bundled" }
impasto-intl = { path = "../../packages/intl/rust", features = ["datagen"] }
base64 = "0.22"
oxc_sourcemap = "9"
flate2 = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
