<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impasto DevTools</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { margin: 0 auto; padding: 28px; max-width: 1120px; }
  h1 { font-size: 26px; margin: 0 0 18px; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  form { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; }
  label { display: grid; gap: 3px; }
  input, button { font: inherit; padding: 5px 9px; }
  #port { width: 85px; }
  #status { min-height: 1.5em; margin: 10px 0 18px; }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr); gap: 24px; }
  .data { max-height: 68vh; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 6px; border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  tr[aria-selected="true"] { background: color-mix(in srgb, Highlight 17%, Canvas); }
  tr[data-late] td:last-child { color: light-dark(#a23513, #ff9a7a); }
  td button { padding: 1px 5px; }
  @media (max-width: 820px) { body { padding: 16px; } main { grid-template-columns: minmax(0, 1fr); } .data { max-height: 48vh; } }
</style>
<h1>Impasto DevTools</h1>
<form id="connection">
  <label>Port <input id="port" inputmode="numeric" type="number" min="1" max="65535" value="%%PORT%%" required></label>
  <label>Session token <input id="token" type="password" pattern="[0-9a-fA-F]{32,128}" autocomplete="off" required></label>
  <button id="connect">Connect</button>
  <button id="capture" type="button" disabled>Record 5 seconds</button>
</form>
<p id="status" role="status">Disconnected</p>
<main>
  <section aria-label="Frames">
    <h2>Frames</h2>
    <div class="data">
      <table>
        <thead><tr><th>Frame</th><th>UI ms</th><th>Queue ms</th><th>Raster ms</th><th>GPU µs</th><th>Total ms</th></tr></thead>
        <tbody id="frames"></tbody>
      </table>
    </div>
  </section>
  <section aria-label="Selected GPU passes">
    <h2 id="detail">GPU passes</h2>
    <p id="summary">Select a frame.</p>
    <div class="data">
      <table>
        <thead><tr><th>Pass</th><th>Slice</th><th>Draws</th><th>µs</th></tr></thead>
        <tbody id="passes"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
"use strict";
const field = id => document.getElementById(id);
const frames = new Map();
const pending = new Map();
let socket;
let selected;
let nextId = 0;
let authenticated = false;
const display = (value, digits = 2) => value == null ? "—" : value.toFixed(digits);
function rpc(method, params) {
  if (socket?.readyState !== WebSocket.OPEN) return Promise.reject(new Error("Disconnected"));
  const id = ++nextId;
  socket.send(JSON.stringify({jsonrpc: "2.0", id, method, params}));
  return new Promise((resolve, reject) => pending.set(id, {resolve, reject}));
}
function addCells(row, values) {
  for (const value of values) row.insertCell().textContent = value;
}
function renderPasses(frame) {
  field("passes").replaceChildren();
  field("detail").textContent = frame ? "GPU passes · Frame " + frame.id : "GPU passes";
  field("summary").textContent = !frame ? "Select a frame."
    : frame.gpu.state === "ready"
    ? display(frame.gpu.frame_span_us) + " µs span · " + display(frame.gpu.passes_sum_us) + " µs summed"
    : "GPU timing " + frame.gpu.state + " · " + frame.passes + " passes";
  for (const pass of frame?.gpu.passes ?? []) {
    addCells(field("passes").insertRow(), [pass.kind, pass.slice ?? "—", pass.draws, display(pass.duration_us)]);
  }
}
function update({reset, frames: samples}) {
  if (reset) frames.clear();
  for (const sample of samples) frames.set(sample.id, sample);
  const latest = [...frames.keys()].sort((a, b) => b - a);
  for (const id of latest.slice(240)) frames.delete(id);
  const visible = latest.slice(0, 120);
  if (selected != null && !visible.includes(selected)) selected = undefined;
  field("frames").replaceChildren();
  for (const id of visible) {
    const frame = frames.get(id);
    const row = field("frames").insertRow();
    row.setAttribute("aria-selected", String(id === selected));
    if (frame.over_budget) row.dataset.late = "";
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = id;
    button.addEventListener("click", () => {
      field("frames").querySelector('[aria-selected="true"]')?.setAttribute("aria-selected", "false");
      row.setAttribute("aria-selected", "true");
      selected = id;
      renderPasses(frame);
    });
    row.insertCell().append(button);
    addCells(row, [display(frame.ui_ms), display(frame.queue_ms), display(frame.raster_ms),
      display(frame.gpu.frame_span_us, 1), display(frame.e2e_ms)]);
  }
  renderPasses(frames.get(selected));
}
field("connection").addEventListener("submit", event => {
  event.preventDefault();
  if (socket) { socket.close(); return; }
  const port = field("port").value;
  const connection = new WebSocket("ws://127.0.0.1:" + port + "/devtools");
  socket = connection;
  field("connect").textContent = "Disconnect";
  field("status").textContent = "Connecting…";
  connection.addEventListener("message", event => {
    const reply = JSON.parse(event.data);
    if (reply.method === "frames") { update(reply.params); return; }
    const request = pending.get(reply.id);
    if (!request) return;
    pending.delete(reply.id);
    if (reply.error) request.reject(new Error(reply.error.message));
    else request.resolve(reply.result);
  });
  connection.addEventListener("open", async () => {
    try {
      await rpc("authenticate", {version: 1, token: field("token").value});
      update(await rpc("subscribe", {}));
      authenticated = true;
      field("status").textContent = "Connected to port " + port;
      field("capture").disabled = false;
    } catch (error) {
      field("status").textContent = error.message;
      connection.close();
    }
  });
  connection.addEventListener("error", () => {
    field("status").textContent = "Connection failed";
  });
  connection.addEventListener("close", () => {
    for (const request of pending.values()) request.reject(new Error("Disconnected"));
    pending.clear();
    socket = undefined;
    field("connect").textContent = "Connect";
    field("capture").disabled = true;
    if (authenticated) field("status").textContent = "Disconnected";
    authenticated = false;
  });
});
field("capture").addEventListener("click", async () => {
  field("capture").disabled = true;
  field("status").textContent = "Recording trace…";
  try {
    const trace = await rpc("capture", {duration_ms: 5000});
    const url = URL.createObjectURL(new Blob([JSON.stringify(trace)], {type: "application/json"}));
    const link = document.createElement("a");
    link.href = url;
    link.download = "impasto-trace.json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    field("status").textContent = "Trace downloaded";
  } catch (error) {
    field("status").textContent = error.message;
  } finally {
    field("capture").disabled = !authenticated;
  }
});
</script>
</html>
