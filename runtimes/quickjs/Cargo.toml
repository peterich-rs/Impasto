[package]
name = "quickjs"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The workspace crate is named `core`. Keeping that extern name shadows
# the standard library crate, and `thiserror` expands to `::core::fmt`.
ui_core = { package = "core", path = "../../core" }
protocol = { workspace = true }
session = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_code = "allow"
unused_qualifications = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
